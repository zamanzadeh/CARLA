# Setup
setup: pretext

# Model
backbone: resnet_ts
model_kwargs:
  head: mlp
  features_dim: 4
res_kwargs:
  in_channels: 8   # TODO: ganti sesuai jumlah kolom fitur load profile PLN Anda
  mid_channels: 4

# Dataset
train_db_name: pln
val_db_name: pln
num_classes: 10

# Loss
criterion: pretext
criterion_kwargs:
  temperature: 0.4

# Hyperparameters
epochs: 30
optimizer: adam
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01
scheduler: cosine
scheduler_kwargs:
  lr_decay_rate: 0.01
batch_size: 50
num_workers: 0

# Transformations
augmentation_strategy: ts
transformation_kwargs:
  noise_sigma: 0.01

anomaly_kwargs:
  portion: 0.99
  # NOVELTY: anomali sintetis pakai 6 fungsi serangan pencurian listrik
  # (f1-f6, Jokar et al. 2016 / Nabil et al. 2018) lewat ElectricityTheftAttack,
  # bukan SubAnomaly generik. Set ke 'subseq' (atau hapus baris ini) untuk
  # kembali ke perilaku CARLA semula bila ingin membandingkan/ablasi.
  # Pilihan: 'subseq' (default/asli) | 'theft' (NOVELTY) | 'theft+subseq'
  # (campuran keduanya, rasio diatur lewat theft_ratio di bawah, default 0.5).
  type: subseq
  # theft_ratio: 0.5   # hanya dipakai kalau type: theft+subseq
