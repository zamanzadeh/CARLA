# Setup
setup: pretext

# Model
backbone: resnet_ts
model_kwargs:
  head: mlp
  features_dim: 4
res_kwargs:
  in_channels: 1    # SGCC: 1 fitur (konsumsi harian kWh)
  mid_channels: 4

# Dataset
train_db_name: sgcc
val_db_name: sgcc
num_classes: 10

# Loss
criterion: pretext
criterion_kwargs:
  temperature: 0.4

# Hyperparameters
epochs: 30
optimizer: adam
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01
scheduler: cosine
scheduler_kwargs:
  lr_decay_rate: 0.01
batch_size: 256    # SGCC memiliki banyak consumer (18K+), batch besar lebih efisien
num_workers: 0

# Transformations
augmentation_strategy: ts
transformation_kwargs:
  noise_sigma: 0.01

# Anomaly injection
# 'theft'       : 6 fungsi EAI Jokar 2016 (NOVELTY — recommended untuk SGCC)
# 'subseq'      : SubAnomaly generik (default/baseline CARLA asli)
# 'theft+subseq': campuran keduanya (rasio diatur lewat theft_ratio, default 0.5)
anomaly_kwargs:
  portion: 0.99
  type: subseq    # SGCC adalah dataset pencurian listrik -> pakai EAI theft
  # theft_ratio: 0.5   # hanya dipakai kalau type: theft+subseq
