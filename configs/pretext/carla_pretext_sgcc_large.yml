# ──────────────────────────────────────────────────────────────
#  CARLA Pretext — SGCC LARGE  (42K consumers, window=365, stride=14)
#  Target: selesai < 15 menit
# ──────────────────────────────────────────────────────────────

# Setup
setup: pretext

# Model
backbone: resnet_ts
model_kwargs:
  head: mlp
  features_dim: 4
res_kwargs:
  in_channels: 1          # SGCC: 1 fitur (kWh harian)
  mid_channels: 4

# Dataset
train_db_name: sgcc_large
val_db_name: sgcc_large
num_classes: 10

# Windowing — KRITIS: harus sama di pretext dan classification
window_size: 365          # 1 tahun = satu musim penuh
stride: 14                # geser 2 minggu

# Loss
criterion: pretext
criterion_kwargs:
  temperature: 0.4

# Hyperparameters
epochs: 5                 # cukup untuk representasi awal; hemat waktu
optimizer: adam
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01
scheduler: cosine
scheduler_kwargs:
  lr_decay_rate: 0.01
batch_size: 256
num_workers: 0            # Windows: hindari multiprocessing deadlock

# Transformations
augmentation_strategy: ts
transformation_kwargs:
  noise_sigma: 0.01

# Anomaly injection
anomaly_kwargs:
  portion: 0.99
  type: theft
