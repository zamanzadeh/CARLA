# setup
setup: classification

# Loss
criterion: classification
criterion_kwargs:
   entropy_weight: 2
   inconsistency_weight: 1

# Weight update
update_cluster_head_only: False
num_heads: 1

# Model
backbone: resnet_ts
res_kwargs:
  in_channels: 8   # TODO: ganti sesuai jumlah kolom fitur load profile PLN Anda (samakan dgn pretext)
  mid_channels: 4

# Dataset
train_db_name: pln
val_db_name: pln
num_classes: 10
num_neighbors: 5

# Transformations
augmentation_strategy: ts
transformation_kwargs:
   noise_sigma: 0.01

# Hyperparameters
optimizer: adam
optimizer_kwargs:
   lr: 0.01
   weight_decay: 0.001
epochs: 50
batch_size: 50
num_workers: 0

# Scheduler
scheduler: constant

anomaly_kwargs:
   portion: 0.99
   # NOVELTY: samakan dgn carla_pretext_pln.yml - pakai ElectricityTheftAttack
   # (f1-f6) bukan SubAnomaly generik. Set ke 'subseq' utk kembali ke perilaku
   # semula bila ingin ablasi/perbandingan.
   # Pilihan: 'subseq' (default/asli) | 'theft' (NOVELTY) | 'theft+subseq'
   # (campuran keduanya, rasio diatur lewat theft_ratio di bawah, default 0.5).
   # HARUS SAMA dengan carla_pretext_pln.yml.
   type: subseq
   # theft_ratio: 0.5   # hanya dipakai kalau type: theft+subseq