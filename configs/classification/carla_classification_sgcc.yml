# Setup
setup: classification

# Loss
criterion: classification
criterion_kwargs:
  entropy_weight: 2
  inconsistency_weight: 1

# Weight update
update_cluster_head_only: False
num_heads: 1

# Model
backbone: resnet_ts
res_kwargs:
  in_channels: 1    # SGCC: 1 fitur (konsumsi harian kWh) — samakan dengan pretext
  mid_channels: 4

# Dataset
train_db_name: sgcc
val_db_name: sgcc
num_classes: 10
num_neighbors: 5

# Transformations
augmentation_strategy: ts
transformation_kwargs:
  noise_sigma: 0.01

# Hyperparameters
optimizer: adam
optimizer_kwargs:
  lr: 0.01
  weight_decay: 0.001
epochs: 50
batch_size: 256    # samakan dengan pretext agar NeighborsDataset konsisten
num_workers: 0

# Scheduler
scheduler: constant

# Anomaly injection — HARUS SAMA dengan carla_pretext_sgcc.yml
anomaly_kwargs:
  portion: 0.99
  type: subseq    # samakan dengan pretext: 'theft' | 'subseq' | 'theft+subseq'
  # theft_ratio: 0.5   # hanya dipakai kalau type: theft+subseq
